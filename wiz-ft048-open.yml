    - generic [ref=f42e273]: Inventory
    - generic [ref=f42e277]:
      - generic [ref=f42e278]: Special Actions
      - generic [ref=f42e445]:
        - generic [ref=f42e446]: "Arcane Recovery:"
        - text: You can regain some of your magical energy by studying your spellbook. When you finish a Short Rest, you can choose expended spell slots to recover. The spell slots can have a combined level equal to no more than half your Wizard level (round up), and none of the slots can be level 6 or higher. Once you use this feature, you can't do so again until you finish a Long Rest.
      - generic [ref=f42e447]:
        - generic [ref=f42e448] [cursor=pointer]: "Illusion Savant:"
        - text: Choose two Wizard spells from Illusion school (no higher than level 2), add to spellbook for free. Whenever you gain access to a new level of spell slots, add one Illusion school spell to spellbook for free.
      - generic [ref=f42e449]:
        - generic [ref=f42e450]: "Illusory Reality:"
        - text: When you cast an Illusion spell with a spell slot, choose one inanimate, nonmagical object that is part of the illusion and make it real. Bonus Action while spell is ongoing. Object remains real for 1 minute, can't deal damage or give any conditions.
      - generic [ref=f42e451]:
        - generic [ref=f42e452]: "Improved Illusions:"
        - text: Cast Illusion spells without Verbal components. If an Illusion spell has range of 10+ feet, range increases by 60 feet. You know Minor Illusion cantrip. If already know it, learn a different Wizard cantrip. Can create both sound and image with single casting of Minor Illusion, and cast as Bonus Action.
      - generic [ref=f42e453]:
        - generic [ref=f42e454]: "Memorize Spell:"
        - text: Whenever you finish a Short Rest, you can study your spellbook and replace one of the level 1+ Wizard spells you have prepared with another level 1+ spell from the book.
      - generic [ref=f42e455]:
        - generic [ref=f42e456]: "Phantasmal Creatures:"
        - text: Always have Summon Beast and Summon Fey prepared. Whenever you cast either spell, you can change its school to Illusion (summoned creature appears spectral). Cast Illusion version of each without spell slot, but casting without slot halves creature's HP. Once per Long Rest.
      - generic [ref=f42e457]:
        - generic [ref=f42e458]: "Resourceful:"
        - text: You gain Heroic Inspiration whenever you finish a Long Rest.
      - generic [ref=f42e459]:
        - generic [ref=f42e460]: "Ritual Adept:"
        - text: You can cast any spell as a Ritual if that spell has the Ritual tag and the spell is in your spellbook. You needn't have the spell prepared, but you must read from the book to cast a spell in this way.
    - generic [ref=f42e301]: Character Advancement
