    - generic [ref=f12e390]:
      - generic [ref=f12e391]: Special Actions
      - generic [ref=f12e392]:
        - generic [ref=f12e393]: "Dreadful Strikes:"
        - text: When you hit with a weapon, deal extra 1d4 Psychic damage (increases to 1d6 at Ranger level 11). Extra damage can only be taken once per turn.
      - generic [ref=f12e394]:
        - generic [ref=f12e395]: "Favored Enemy:"
        - text: You always have the Hunter's Mark spell prepared. You can cast it twice without expending a spell slot, and you regain all expended uses when you finish a Long Rest. The number of times you can cast the spell without a spell slot increases when you reach certain Ranger levels, as shown in the Favored Enemy column of the Ranger Features table.
      - generic [ref=f12e396]:
        - generic [ref=f12e397] [cursor=pointer]: "Fey Reinforcements:"
        - text: Cast Summon Fey without Material component. Cast it once without spell slot, regain on Long Rest. Can modify it to not require Concentration (duration becomes 1 minute).
      - generic [ref=f12e398]:
        - generic [ref=f12e399]: "Misty Wanderer:"
        - text: Cast Misty Step without spell slot, uses = Wisdom modifier (minimum once). When casting Misty Step, bring one willing creature within 5 feet to an unoccupied space within 5 feet of your destination.
      - generic [ref=f12e400]:
        - generic [ref=f12e401]: "Otherworldly Glamour:"
        - text: Bonus to Charisma checks = Wisdom modifier (minimum +1). Gain proficiency in Deception, Performance, or Persuasion.
      - generic [ref=f12e402]:
        - generic [ref=f12e403]: "Relentless Hunter:"
        - text: Taking damage can't break your Concentration on Hunter's Mark.
      - generic [ref=f12e404]:
        - generic [ref=f12e405]: "Resourceful:"
        - text: You gain Heroic Inspiration whenever you finish a Long Rest.
      - generic [ref=f12e406]:
        - generic [ref=f12e407]: "Roving:"
        - text: Your Speed increases by 10 feet while you aren't wearing Heavy armor. You also have a Climb Speed and a Swim Speed equal to your Speed.
      - generic [ref=f12e408]:
        - generic [ref=f12e409] [cursor=pointer]: "Weapon Mastery:"
        - text: Your training with weapons allows you to use the mastery properties of two kinds of weapons of your choice with which you have proficiency. Whenever you finish a Long Rest, you can change the kinds of weapons you chose.
    - generic [ref=f12e411]:
      - generic [ref=f12e412]: Character Advancement
      - generic [ref=f12e413]:
        - generic [ref=f12e414]: "Deft Explorer:"
        - text: Expertise. Choose one of your skill proficiencies with which you lack Expertise. You gain Expertise in that skill. Languages. You know two languages of your choice from the language tables.
      - generic [ref=f12e415]:
        - generic [ref=f12e416]: "Expertise:"
        - text: Choose two of your skill proficiencies with which you lack Expertise. You gain Expertise in those skills.