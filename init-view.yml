        - generic [ref=f7e255]:
          - generic [ref=f7e256] [cursor=pointer]: "Healing Hands:"
          - text: As a Action, you touch a creature and roll a number of d4s equal to your Proficiency Bonus. The creature regains a number of Hit Points equal to the total rolled. Once you use this trait, you can't use it again until you finish a Long Rest.
        - generic [ref=f7e257]: "Base Actions: Attack, Cast a Spell, Dash, Disengage, Dodge, Grapple, Help, Hide, Improvise, Ready, Search, Shove, Use an Object"
      - generic [ref=f7e258]:
        - generic [ref=f7e259]: Bonus Actions
        - generic [ref=f7e260]:
          - generic [ref=f7e261]:
            - generic [ref=f7e262] [cursor=pointer]: "Celestial Revelation:"
            - text: "When you reach character level 3, you can transform as a Bonus Action using one of the options below (choose the option each time you transform). The transformation lasts for 1 minute or until you end it (no action required). Once you transform, you can't do so again until you finish a Long Rest. Once on each of your turns before the transformation ends, you can deal extra damage to one target when you deal damage to it with an attack or a spell. The extra damage equals your Proficiency Bonus, and the extra damage's type is either Necrotic for Necrotic Shroud or Radiant for Heavenly Wings and Inner Radiance. Here are the transformation options:"
          - generic [ref=f7e263]:
            - generic [ref=f7e264] [cursor=pointer]: "Cunning Action:"
            - text: "On your turn, you can take one of the following actions as a Bonus Action: Dash, Disengage, or Hide."
          - generic [ref=f7e265]:
            - generic [ref=f7e266] [cursor=pointer]: "Steady Aim:"
            - text: As a Bonus Action, you give yourself Advantage on your next attack roll on the current turn. You can use this feature only if you haven't moved during this turn, and after you use it, your Speed is 0 until the end of the current turn.
    - generic [ref=f7e267]:
      - generic [ref=f7e268]: Reactions
      - generic [ref=f7e269]:
        - generic [ref=f7e270] [cursor=pointer]: "Uncanny Dodge:"
        - text: When an attacker that you can see hits you with an attack roll, you can take a Reaction to halve the attack's damage against you (round down).
      - generic [ref=f7e271]:
        - generic [ref=f7e272] [cursor=pointer]: "Opportunity Attack:"
        - text: Can attack creature that moves out of your reach
    - generic [ref=f7e273]:
      - generic [ref=f7e274]: Inventory
      - generic [ref=f7e275]:
        - generic [ref=f7e276]: "Equipped:"
        - text: Shortsword
    - generic [ref=f7e277]:
      - generic [ref=f7e278]: Special Actions
      - generic [ref=f7e279]:
        - generic [ref=f7e280]: "Assassin's Tools:"
        - text: Gain Disguise Kit and Poisoner's Kit, proficiency with them.
      - generic [ref=f7e281]:
        - generic [ref=f7e282]: "Assassinate:"
        - text: "Initiative: Advantage on Initiative rolls. Surprising Strikes: During first round of each combat, Advantage on attack rolls against any creature that hasn't taken a turn. If Sneak Attack hits any target during that round, target takes extra damage equal to your Rogue level."
      - generic [ref=f7e283]:
        - generic [ref=f7e284]: "Cunning Strike:"
        - text: "When you deal Sneak Attack damage, you can add one of the following Cunning Strike effects (each has a die cost - number of Sneak Attack damage dice you must forgo): Poison (Cost: 1d6). Add toxin, target makes Constitution save or has Poisoned condition for 1 minute (repeats save each turn). Must have Poisoner's Kit. Trip (Cost: 1d6). Large or smaller target makes Dexterity save or has Prone condition. Withdraw (Cost: 1d6). Immediately after attack, move up to half Speed without provoking Opportunity Attacks."
      - generic [ref=f7e285]:
        - generic [ref=f7e286]: "Devious Strikes:"
        - text: "New Cunning Strike options: Daze (Cost: 2d6). Target makes Constitution save or on next turn can only do one of: move or take action or Bonus Action. Knock Out (Cost: 6d6). Target makes Constitution save or has Unconscious condition for 1 minute (repeats save at end of each turn). Obscure (Cost: 3d6). Target makes Dexterity save or has Blinded condition until end of its next turn."
      - generic [ref=f7e287]:
        - generic [ref=f7e288]: "Envenom Weapons:"
        - text: When using Poison option of Cunning Strike, target also takes 2d6 Poison damage on failed save. This damage ignores Resistance to Poison damage.
      - generic [ref=f7e289]:
        - generic [ref=f7e290]: "Evasion:"
        - text: When you're subjected to an effect that allows a Dexterity saving throw to take only half damage, you take no damage if you succeed and only half damage if you fail. Can't use if Incapacitated.
      - generic [ref=f7e291]:
        - generic [ref=f7e292]: "Improved Cunning Strike:"
        - text: You can use up to two Cunning Strike effects when you deal Sneak Attack damage, paying the die cost for each effect.
      - generic [ref=f7e293]:
        - generic [ref=f7e294]: "Infiltration Expertise:"
        - text: "Masterful Mimicry: unerringly mimic another person's speech, handwriting, or both if studied for 1 hour. Roving Aim: Speed not reduced to 0 by Steady Aim."
      - generic [ref=f7e295]:
        - generic [ref=f7e296]: "Reliable Talent:"
        - text: Whenever you make an ability check that uses one of your skill or tool proficiencies, you can treat a d20 roll of 9 or lower as a 10.
      - generic [ref=f7e297]:
        - generic [ref=f7e298]: "Sneak Attack:"
        - text: You know how to strike subtly and exploit a foe's distraction. Once per turn, you can deal an extra 1d6 damage to one creature you hit with an attack roll if you have Advantage on the roll and the attack uses a Finesse or a Ranged weapon. The extra damage's type is the same as the weapon's type. You don't need Advantage on the attack roll if at least one of your allies is within 5 feet of the target, the ally doesn't have the Incapacitated condition, and you don't have Disadvantage on the attack roll. The extra damage increases as you gain Rogue levels.
      - generic [ref=f7e299]:
        - generic [ref=f7e300] [cursor=pointer]: "Weapon Mastery:"
        - text: Your training with weapons allows you to use the mastery properties of two kinds of weapons of your choice with which you have proficiency. Whenever you finish a Long Rest, you can change the kinds of weapons you chose.
    - generic [ref=f7e302]:
      - generic [ref=f7e303]: Character Advancement
      - generic [ref=f7e304]:
        - generic [ref=f7e305]: "Expertise:"
        - text: You gain Expertise in two more of your skill proficiencies of your choice.
      - generic [ref=f7e306]:
        - generic [ref=f7e307]: "LightBearer:"
        - text: You know the Light cantrip. Charisma is your spellcasting ability for it.