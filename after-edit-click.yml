        - generic [ref=f30e333]:
          - generic [ref=f30e334] [cursor=pointer]: "Blessing of the Trickster:"
          - text: As a Action, you can choose yourself or a willing creature within 30 feet of yourself to have Advantage on Dexterity (Stealth) checks. This blessing lasts until you finish a Long Rest or you use this feature again.
        - generic [ref=f30e335]:
          - generic [ref=f30e336] [cursor=pointer]: "Divine Intervention:"
          - text: You can call on your deity or pantheon to intervene on your behalf. As a Action, choose any Cleric spell of level 5 or lower that doesn't require a Reaction to cast. As part of the same action, you cast that spell without expending a spell slot or needing Material components. You can't use this feature again until you finish a Long Rest.
        - generic [ref=f30e337]:
          - generic [ref=f30e338] [cursor=pointer]: "Divine Spark:"
          - text: As a Action, you point your Holy Symbol at another creature you can see within 30 feet of yourself and focus divine energy at it. Roll 1d8 and add your Wisdom modifier. You either restore Hit Points to the creature equal to that total or force the creature to make a Constitution saving throw. On a failed save, the creature takes Necrotic or Radiant damage (your choice) equal to that total.
        - generic [ref=f30e339]:
          - generic [ref=f30e340] [cursor=pointer]: "Turn Undead:"
          - text: As a Action, you present your Holy Symbol and censure Undead creatures. Each Undead of your choice within 30 feet of you must make a Wisdom saving throw. If the creature fails its save, it has the Frightened and Incapacitated conditions for 1 minute.
        - generic [ref=f30e257]: "Base Actions: Attack, Cast a Spell, Dash, Disengage, Dodge, Grapple, Help, Hide, Improvise, Ready, Search, Shove, Use an Object"
