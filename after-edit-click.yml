    - generic [ref=f30e277]:
      - generic [ref=f30e278]: Special Actions
      - generic [ref=f30e550]:
        - generic [ref=f30e551] [cursor=pointer]: "Blessed Strikes:"
        - text: "Divine power infuses you in battle. You gain one of the following options of your choice: Divine Strike. Once on each of your turns when you hit a creature with an attack roll using a weapon, you can cause the target to take an extra 1d8 Necrotic or Radiant damage (your choice). Potent Spellcasting. Add your Wisdom modifier to the damage you deal with any Cleric cantrip."
      - generic [ref=f30e552]:
        - generic [ref=f30e553]: "Divine Strike:"
        - text: Divine power infuses you in battle. Once on each of your turns when you hit a creature with an attack roll using a weapon, you can cause the target to take an extra 1d8 Radiant damage.
      - generic [ref=f30e554]:
        - generic [ref=f30e555] [cursor=pointer]: "Improved Blessed Strikes:"
        - text: The option you chose for Blessed Strikes grows more powerful. Divine Strike. The extra damage of your Divine Strike increases to 2d8. Potent Spellcasting. When you cast a Cleric cantrip and deal damage to a creature with it, you can give vitality to yourself or another creature within 60 feet of yourself, granting a number of Temporary Hit Points equal to twice your Wisdom modifier.
      - generic [ref=f30e556]:
        - generic [ref=f30e557]: "Improved Duplicity:"
        - text: "The illusion has grown more powerful: Enhanced Distraction - when you and your allies make attack rolls against a creature within 5 feet of the illusion, the attacks have Advantage. Healing Illusion - when the illusion ends, you or a creature of your choice within 5 feet of it regains a number of Hit Points equal to your Cleric level."
      - generic [ref=f30e558]:
        - generic [ref=f30e559]: "Resourceful:"
        - text: You gain Heroic Inspiration whenever you finish a Long Rest.
      - generic [ref=f30e560]:
        - generic [ref=f30e561]: "Searing Undead:"
        - text: Whenever you use Turn Undead, you can roll a number of d8s equal to your Wisdom modifier (minimum of 1d8) and add the rolls together. Each Undead that fails its saving throw against that use of Turn Undead takes Radiant damage equal to the roll's total.
    - generic [ref=f30e302]:
      - generic [ref=f30e303]: Character Advancement
      - generic [ref=f30e562]:
        - generic [ref=f30e563]: "Divine Order:"
        - text: You have dedicated yourself to one of the following sacred roles of your choice. Protector. Trained for battle, you gain proficiency with Martial weapons and training with Heavy armor. Thaumaturge. You know one extra cantrip from the Cleric spell list. In addition, your mystical connection to the divine gives you a bonus to your Intelligence (Arcana or Religion) checks. The bonus equals your Wisdom modifier (minimum of +1).
