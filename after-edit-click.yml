          - generic [ref=f30e355]:
            - generic [ref=f30e356] [cursor=pointer]: "Invoke Duplicity:"
            - text: "As a Bonus Action, you can expend one use of your Channel Divinity to create a perfect visual illusion of yourself in an unoccupied space you can see within 30 feet of yourself. The illusion lasts for 1 minute. While it persists: Cast Spells - you can cast spells as though you were in the illusion's space. Distract - when both you and your illusion are within 5 feet of a creature that can see the illusion, you have Advantage on attack rolls against that creature. Move - as a Bonus Action, you can move the illusion up to 30 feet."
          - generic [ref=f30e357]:
            - generic [ref=f30e358] [cursor=pointer]: "Trickster's Transposition:"
            - text: Whenever you take the Bonus Action to create or move the illusion of your Invoke Duplicity, you can teleport, swapping places with the illusion.
